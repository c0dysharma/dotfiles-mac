# Prefix: Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Jump to pane by number
bind 0 select-pane -t 0
bind 1 select-pane -t 1
bind 2 select-pane -t 2
bind 3 select-pane -t 3

# hjkl pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Status bar
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify centre

# Vi mode for copy/scroll
set -g mode-keys vi

# Mouse support
set -g mouse on

# On mouse release: copy to clipboard, clear selection, but don't scroll to bottom
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# Reduce scroll speed (1 line per wheel event)
bind -T root WheelUpPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t= ; copy-mode -e ; send-keys -X -N 1 scroll-up"
bind -T root WheelDownPane if-shell -F "#{alternate_on}" "send-keys -M" "select-pane -t= ; send-keys -X -N 1 scroll-down"
bind -T copy-mode-vi WheelUpPane send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane send-keys -X -N 1 scroll-down

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'egel/tmux-gruvbox'

# Gruvbox dark (plugin base)
set -g @tmux-gruvbox 'dark256'

# Save/restore neovim sessions too
set -g @resurrect-strategy-nvim 'session'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'

# Override to gruvbox dark HARD contrast (bg0_h #1d2021)
# Must come AFTER TPM run so it overrides plugin
set -g status-style "bg=#1d2021,fg=#ebdbb2"
set -g pane-border-style "fg=#3c3836"
set -g pane-active-border-style "fg=#83a598"
